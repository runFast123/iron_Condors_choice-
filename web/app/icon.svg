<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Choice brand mark: their ink (#0f1621) and logo blue (#2777f3).
       A "C" monogram with the underline flourish the wordmark uses, which
       stays legible at 16px where a detailed glyph would not. -->
  <rect width="64" height="64" rx="14" fill="#0f1621"/>
  <path d="M44 22.5a15 15 0 1 0 0 19"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round"/>
  <path d="M17 51.5c7-3.6 23-3.6 30 0"
        fill="none" stroke="#2777f3" stroke-width="4.5"
        stroke-linecap="round"/>
</svg>
